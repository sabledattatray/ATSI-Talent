<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0d2347"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow Orb -->
  <circle cx="950" cy="280" r="180" fill="#2563eb" fill-opacity="0.25" filter="url(#glow)"/>

  <!-- Left: Content Info -->
  <g transform="translate(80, 80)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#1e40af" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
    <text x="110" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">ATSAI TALENT SOLUTIONS</text>

    <!-- Category Pill -->
    <rect x="0" y="60" width="165" height="28" rx="6" fill="#2563eb" fill-opacity="0.3"/>
    <text x="12" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" letter-spacing="0.5">RECRUITMENT TECH</text>

    <!-- Headline -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      What Is an Applicant
    </text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Tracking System (ATS)?
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Complete 2026 Guide for Employers, Recruiters &amp; Hiring Teams
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 340)">
      <circle cx="8" cy="8" r="4" fill="#3b82f6"/>
      <text x="25" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Resume Parsing Mechanics</text>

      <circle cx="238" cy="8" r="4" fill="#3b82f6"/>
      <text x="255" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">ATS vs CRM vs HRMS</text>

      <circle cx="438" cy="8" r="4" fill="#3b82f6"/>
      <text x="455" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">DPDP Act Compliance</text>
    </g>
  </g>

  <!-- Right Graphic: Illustrated Pipeline Card -->
  <g transform="translate(740, 140)">
    <!-- Background Card -->
    <rect width="380" height="360" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header in Card -->
    <rect x="24" y="24" width="130" height="20" rx="4" fill="#1e293b"/>
    <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">TALENT PIPELINE</text>
    
    <!-- Pipeline Stage 1 -->
    <rect x="24" y="65" width="332" height="70" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="55" cy="100" r="16" fill="#2563eb" fill-opacity="0.3"/>
    <text x="55" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">01</text>
    <text x="88" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Resume Ingestion &amp; Parsing</text>
    <text x="88" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">PDF / Word extraction · 100% data fidelity</text>

    <!-- Pipeline Stage 2 -->
    <rect x="24" y="150" width="332" height="70" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="55" cy="185" r="16" fill="#0ea5e9" fill-opacity="0.3"/>
    <text x="55" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">02</text>
    <text x="88" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Screening &amp; Scorecards</text>
    <text x="88" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Standardized competency rating rubrics</text>

    <!-- Pipeline Stage 3 -->
    <rect x="24" y="235" width="332" height="70" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="55" cy="270" r="16" fill="#059669" fill-opacity="0.3"/>
    <text x="55" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">03</text>
    <text x="88" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Offer Extended &amp; Hired</text>
    <text x="88" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Seamless handoff to HRMS onboarding</text>
  </g>
</svg>
