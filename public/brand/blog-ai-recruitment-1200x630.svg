<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="950" cy="280" r="180" fill="#0284c7" fill-opacity="0.25" filter="url(#glow)"/>

  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1.5">ATSAI TALENT SOLUTIONS</text>

    <rect x="0" y="60" width="180" height="28" rx="6" fill="#0284c7" fill-opacity="0.3"/>
    <text x="12" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5">ETHICAL AI IN HR</text>

    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      AI in Recruitment:
    </text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Benefits, Risks &amp; Ethics
    </text>

    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      A 2026 Practical Guide to Machine Learning, Bias Auditing &amp; DPDP
    </text>

    <g transform="translate(0, 340)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="25" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Semantic Vector Matching</text>

      <circle cx="238" cy="8" r="4" fill="#38bdf8"/>
      <text x="255" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Human-in-the-Loop Oversight</text>

      <circle cx="458" cy="8" r="4" fill="#38bdf8"/>
      <text x="475" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Algorithmic Bias Mitigation</text>
    </g>
  </g>

  <!-- Right Graphic: Neural & Candidate Network Nodes -->
  <g transform="translate(740, 140)">
    <rect width="380" height="360" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    
    <rect x="24" y="24" width="160" height="20" rx="4" fill="#1e293b"/>
    <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">INTELLIGENT PARSING</text>

    <!-- Network Lines -->
    <line x1="80" y1="120" x2="190" y2="180" stroke="#0284c7" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="80" y1="240" x2="190" y2="180" stroke="#0284c7" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="190" y1="180" x2="300" y2="120" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="190" y1="180" x2="300" y2="240" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Nodes -->
    <circle cx="80" cy="120" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">Skills</text>

    <circle cx="80" cy="240" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">Roles</text>

    <!-- Center AI Hub -->
    <circle cx="190" cy="180" r="34" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="190" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">AI NLP</text>

    <!-- Output Nodes -->
    <circle cx="300" cy="120" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">Match</text>

    <circle cx="300" cy="240" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">Audit</text>

    <rect x="24" y="295" width="332" height="40" rx="8" fill="#1e293b" fill-opacity="0.6"/>
    <text x="190" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Human Recruiter Makes Final Decision</text>
  </g>
</svg>
