<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="950" cy="280" r="180" fill="#9333ea" fill-opacity="0.25" filter="url(#glow)"/>

  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#581c87" fill-opacity="0.6" stroke="#a855f7" stroke-width="1"/>
    <text x="110" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="1.5">ATSAI TALENT SOLUTIONS</text>

    <rect x="0" y="60" width="180" height="28" rx="6" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="12" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="0.5">HIRING STRATEGY</text>

    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Recruitment Process
    </text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Optimization Guide
    </text>

    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      15 Proven Strategies to Reduce Time-to-Hire &amp; Cost-per-Hire
    </text>

    <g transform="translate(0, 340)">
      <circle cx="8" cy="8" r="4" fill="#a855f7"/>
      <text x="25" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Funnel Bottleneck Analysis</text>

      <circle cx="238" cy="8" r="4" fill="#a855f7"/>
      <text x="255" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Structured Scorecards</text>

      <circle cx="438" cy="8" r="4" fill="#a855f7"/>
      <text x="455" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">30-60-90 Day Roadmap</text>
    </g>
  </g>

  <!-- Right Graphic: Analytics & Funnel Metric Card -->
  <g transform="translate(740, 140)">
    <rect width="380" height="360" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    
    <rect x="24" y="24" width="150" height="20" rx="4" fill="#1e293b"/>
    <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a855f7" letter-spacing="1">VELOCITY METRICS</text>

    <!-- Stat 1 -->
    <g transform="translate(24, 65)">
      <rect width="158" height="110" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TIME TO HIRE</text>
      <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">21 Days</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399">↓ 48% reduction</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(198, 65)">
      <rect width="158" height="110" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">OFFER ACCEPT</text>
      <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#34d399">88%</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">↑ Top quartile</text>
    </g>

    <!-- Funnel Stage Bar -->
    <g transform="translate(24, 200)">
      <rect width="332" height="120" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Hiring Funnel Health</text>
      
      <rect x="16" y="45" width="300" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="45" width="240" height="10" rx="5" fill="#3b82f6"/>
      <text x="16" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Screening Pass: 80%</text>

      <rect x="16" y="85" width="300" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="85" width="180" height="10" rx="5" fill="#10b981"/>
      <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Interview to Offer: 25%</text>
    </g>
  </g>
</svg>
