
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" fill="none" width="360" height="90">
      <title>ATSAI Technologies</title>
      <!-- Emblem Icon -->
      <g transform="translate(4, 3) scale(0.84)">
        
    <defs>
      <!-- Primary Sapphire to Deep Cobalt gradient -->
      <linearGradient id="logo-dark-g-left" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="45%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>

      <!-- Electric Cyan to Sky Azure gradient -->
      <linearGradient id="logo-dark-g-right" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="35%" stop-color="#06B6D4"/>
        <stop offset="100%" stop-color="#0284C7"/>
      </linearGradient>

      <!-- Central Upward Arrow Ascension gradient -->
      <linearGradient id="logo-dark-g-arrow" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#1E40AF"/>
        <stop offset="40%" stop-color="#2563EB"/>
        <stop offset="85%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#E0F2FE"/>
      </linearGradient>

      <!-- Bottom fold return gradients for 3D ribbon depth -->
      <linearGradient id="logo-dark-g-fold-l" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#172554"/>
        <stop offset="100%" stop-color="#1E40AF"/>
      </linearGradient>

      <linearGradient id="logo-dark-g-fold-r" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#082F49"/>
        <stop offset="100%" stop-color="#0369A1"/>
      </linearGradient>

      <!-- Luminous Apex Crest -->
      <linearGradient id="logo-dark-g-crest" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#93C5FD"/>
        <stop offset="50%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#A5F3FC"/>
      </linearGradient>

      <!-- High-tech subtle glow -->
      <filter id="logo-dark-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- Main Icon Group -->
    <g id="logo-dark-group">
      <!-- Left Outer Pillar of the "A" -->
      <path d="M 50 10 
               L 16 72 
               C 14.5 75 16 78.5 19.5 78.5 
               L 31 78.5 
               C 33 78.5 34.8 77.3 35.8 75.5 
               L 43.5 61 
               L 50 48 
               L 50 10 Z" 
            fill="url(#logo-dark-g-left)"/>

      <!-- Right Outer Pillar of the "A" -->
      <path d="M 50 10 
               L 84 72 
               C 85.5 75 84 78.5 80.5 78.5 
               L 69 78.5 
               C 67 78.5 65.2 77.3 64.2 75.5 
               L 56.5 61 
               L 50 48 
               L 50 10 Z" 
            fill="url(#logo-dark-g-right)"/>

      <!-- Lower Left Folded Return Bevel (Adds 3D ribbon precision) -->
      <path d="M 19.5 78.5 
               L 14 86 
               C 13 87.5 14.2 89.5 16 89.5 
               L 33 89.5 
               L 31 78.5 Z" 
            fill="url(#logo-dark-g-fold-l)"/>

      <!-- Lower Right Folded Return Bevel -->
      <path d="M 80.5 78.5 
               L 86 86 
               C 87 87.5 85.8 89.5 84 89.5 
               L 67 89.5 
               L 69 78.5 Z" 
            fill="url(#logo-dark-g-fold-r)"/>

      <!-- Upward Ascending Chevron Arrow (Career Advancement & AI matching apex) -->
      <path d="M 50 24 
               L 66 54 
               L 57 54 
               L 50 41 
               L 43 54 
               L 34 54 Z" 
            fill="url(#logo-dark-g-arrow)"/>

      <!-- Intersecting Hex-Nexus Bridge Bar -->
      <path d="M 33 63 
               L 43 63 
               L 50 51 
               L 57 63 
               L 67 63 
               L 61 73 
               L 39 73 Z" 
            fill="url(#logo-dark-g-left)" 
            opacity="0.9"/>

      <!-- Apex Prism Cap (Crystal light highlight) -->
      <polygon points="50,10 44,18 50,22 56,18" fill="url(#logo-dark-g-crest)"/>

      <!-- Central Luminous Spark Node (Convergence of AI & Talent) -->
      <circle cx="50" cy="46" r="3" fill="#FFFFFF"/>
      <circle cx="50" cy="46" r="1.5" fill="#38BDF8"/>
    </g>
  
      </g>

      <!-- Wordmark ATSAI -->
      <g transform="translate(100, 16)">
        <!-- "ATS" Letters in ultra-clean geometric sans-serif -->
        <text x="0" y="44" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
              font-size="44" 
              font-weight="850" 
              letter-spacing="-1" 
              fill="#FFFFFF">
          ATS
        </text>

        <!-- "AI" highlighted with vibrant tech gradient -->
        <defs>
          <linearGradient id="logo-dark-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="60%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
        </defs>

        <text x="96" y="44" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
              font-size="44" 
              font-weight="850" 
              letter-spacing="-1" 
              fill="url(#logo-dark-ai-grad)">
          AI
        </text>

        <!-- Subtle Tech Pulse Dot next to AI -->
        <circle cx="152" cy="18" r="3" fill="#00F0FF"/>

        <!-- Subtitle: TECHNOLOGIES -->
        <text x="2" y="63" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
              font-size="11.5" 
              font-weight="650" 
              letter-spacing="5" 
              fill="#94A3B8">
          TECHNOLOGIES
        </text>
      </g>
    </svg>
  